<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ACME Plant 1</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body>
<header class="topbar">
  <span class="brand"><span class="logo">MES</span><span>ACME Plant 1<small>{{ plant.company }}</small></span></span>
</header>
<main>
  <div class="panel login-card">
    <h2 style="margin-bottom:14px">Sign in</h2>
    <form id="login">
      <label class="field">User name<input name="username" autocomplete="username" required autofocus></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center">Sign in</button>
      <p id="msg" class="notice error" style="display:none;margin-top:12px"></p>
    </form>
    <p class="faint" style="font-size:12px;margin-top:14px">A lab: a fictional plant and its manufacturing execution system,
      designed and built by <a href="https://github.com/lukacmichal" target="_blank" rel="noopener">Michal Lukáč</a>.</p>
  </div>
</main>
<script>
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const msg = document.getElementById("msg");
    const r = await fetch("/api/v1/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: f.get("username"), password: f.get("password") }),
    });
    if (r.ok) {
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.href = next.startsWith("/") && !next.startsWith("//") ? next : "/";
    } else {
      let detail = "Sign in failed";
      try { detail = (await r.json()).detail; } catch (err) { /* keep default */ }
      msg.textContent = detail;
      msg.style.display = "block";
    }
  });
</script>
</body>
</html>
