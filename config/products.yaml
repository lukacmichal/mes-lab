# Customers, materials (finished goods and PCB assemblies) and their routings.
#
# A routing is a list of operations. One operation = one pass through one line:
#   SMT_BOT / SMT_TOP - one side of the panel on an SMT line (double-sided boards
#                       run bottom side first, then top side on the same line)
#   FA                - final assembly line
# steps: station type -> ideal cycle time in seconds per handling unit
#   (per panel on SMT, per unit in final assembly). Station types of the line
#   that are not listed are passed through on the conveyor.
#
# planning (PCBA): the demo planner keeps the SMT supermarket above safety_stock
#   and splits SMT orders into lots between min_lot and max_lot (boards).
# planning (FG): final assembly order sizes are picked from lot_sizes (units).
#
# Sizes in millimetres (the live plan draws pieces with them):
#   panel_mm / panel_grid (PCBA): the panel and how its boards sit on it (across x down)
#   unit_mm (FG): the finished product, length x width x height
#   kit (FG): the parts final assembly adds to one unit; they come in bins of per_bin sets, which the
#             robots bring from the goods-in warehouse to the rack at the loader (two-bin kanban)
#   packing.klt_mm: the KLT box; packing.pallet_mm / pallet_type: the pallet (EUR 1200 x 800, CP1 1200 x 1000)

customers:
  - {code: KRAFTWAGEN, name: Kraftwagen AG, country: DE}
  - {code: NORDAUTO,   name: Nordauto AB, country: SE}
  - {code: VOLTARO,    name: Voltaro Mobility s.r.o., country: CZ}

materials:

  # ------------------------------------------------------------- PCB assemblies
  - code: PCBA-BCM-200
    name: BCM-200 PCB assembly
    kind: PCBA
    boards_per_panel: 4
    panel_mm: [280, 220]
    panel_grid: [2, 2]
    planning: {safety_stock: 1200, initial_stock: 1200, min_lot: 480, max_lot: 720}
    routing:
      - op: SMT_BOT
        name: SMT bottom side
        steps: {LOADER: 8, LASER_PCB: 16, PASTE_PRINTER: 24, SPI: 20, PNP_CHIP: 42, PNP_IC: 34,
                REFLOW_OVEN: 30, AOI: 28, UNLOADER: 8}
      - op: SMT_TOP
        name: SMT top side
        steps: {LOADER: 8, PASTE_PRINTER: 24, SPI: 20, PNP_CHIP: 50, PNP_IC: 52,
                REFLOW_OVEN: 30, AOI: 34, UNLOADER: 8, DEPANELER: 40}

  - code: PCBA-LED-DRV-40
    name: LED-DRV-40 PCB assembly
    kind: PCBA
    boards_per_panel: 8
    panel_mm: [330, 160]
    panel_grid: [4, 2]
    planning: {safety_stock: 500, initial_stock: 500, min_lot: 800, max_lot: 800}
    routing:
      - op: SMT_TOP
        name: SMT top side
        steps: {LOADER: 8, LASER_PCB: 22, PASTE_PRINTER: 22, SPI: 18, PNP_CHIP: 45, PNP_IC: 30,
                REFLOW_OVEN: 30, AOI: 30, UNLOADER: 8, DEPANELER: 40}

  - code: PCBA-BMS-12S
    name: BMS-12S PCB assembly
    kind: PCBA
