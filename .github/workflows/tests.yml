name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  quick:
    # the MES and its pages: everything that does not simulate hours of the plant
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The app with the versions the server runs, the test tools on top without them:
      # amqtt (the MQTT broker of the tests) pins websockets==15.0.1, the server runs 17.2.
      - run: pip install -c deploy/constraints.txt -e .
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not slow"

  full:
    # the whole plant, hours of it: about half an hour, so only when asked for (Actions -> tests -> Run workflow)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MES_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -c deploy/constraints.txt -e .
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
