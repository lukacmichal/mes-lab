    panel_mm: [200, 110]
    panel_grid: [2, 1]
    planning: {safety_stock: 500, initial_stock: 500, min_lot: 240, max_lot: 360}
    routing:
      - op: SMT_BOT
        name: SMT bottom side
        steps: {LOADER: 8, LASER_PCB: 12, PASTE_PRINTER: 22, SPI: 18, PNP_CHIP: 34, PNP_IC: 26,
                REFLOW_OVEN: 30, AOI: 26, UNLOADER: 8}
      - op: SMT_TOP
        name: SMT top side
        steps: {LOADER: 8, PASTE_PRINTER: 22, SPI: 18, PNP_CHIP: 46, PNP_IC: 48,
                REFLOW_OVEN: 30, AOI: 30, UNLOADER: 8, DEPANELER: 24}

  - code: PCBA-PDC-8
    name: PDC-8 PCB assembly
    kind: PCBA
    boards_per_panel: 6
    panel_mm: [300, 190]
    panel_grid: [3, 2]
    planning: {safety_stock: 500, initial_stock: 500, min_lot: 600, max_lot: 600}
    routing:
      - op: SMT_TOP
        name: SMT top side
        steps: {LOADER: 8, LASER_PCB: 20, PASTE_PRINTER: 24, SPI: 20, PNP_CHIP: 50, PNP_IC: 70,
                REFLOW_OVEN: 30, AOI: 32, UNLOADER: 8, DEPANELER: 40}

  # ------------------------------------------------------------- Finished goods
  - code: BCM-200
    name: Body control module BCM-200
    kind: FG
    customer: KRAFTWAGEN
    pcba: PCBA-BCM-200
    unit_mm: [140, 100, 38]
    packing: {klt_qty: 24, klt_per_pallet: 40, klt_mm: [400, 300, 147], pallet_mm: [1200, 800], pallet_type: EUR}
    kit: {name: "housing, cover and connector", per_bin: 24}
    planning: {lot_sizes: [480, 720, 960]}
    routing:
      - op: FA
